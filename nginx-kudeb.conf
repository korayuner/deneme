# Nginx reverse proxy konfigürasyonu — kudeb.urla.online
# /etc/nginx/sites-available/kudeb.urla.online dosyasına ekleyin
# Ardından: ln -s /etc/nginx/sites-available/kudeb.urla.online /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name kudeb.urla.online;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kudeb.urla.online;

    ssl_certificate /etc/letsencrypt/live/kudeb.urla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kudeb.urla.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Max upload size (for document uploads)
    client_max_body_size 50M;

    # Proxy to kudeb-panel container
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
